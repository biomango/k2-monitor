[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.1
    bodmer/TFT_eSPI@^2.5.43

; ---- TFT_eSPI 腳位設定（SD2 / SmallTV 常見接法，請對照你的板子）----
; 螢幕顏色整個反相（黑變白）：刪掉 TFT_INVERSION_ON 這行
; 紅藍對調：加上 -D TFT_RGB_ORDER=TFT_BGR
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_INVERSION_ON=1
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=-1
    -D TFT_DC=0
    -D TFT_RST=2
    -D SPI_FREQUENCY=40000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    ; 若想用你 fork 裡的中文配網字串，加上下面這行並放入 wm_strings_zh.h
    ; -D WM_STRINGS_FILE='"wm_strings_zh.h"'
