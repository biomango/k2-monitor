name: Build firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run

      - name: Name ESP8266 firmware BIN
        run: cp .pio/build/nodemcuv2/firmware.bin esp8266-nodemcuv2-firmware.bin

      - name: Upload ESP8266 firmware BIN
        uses: actions/upload-artifact@v4
        with:
          name: ESP8266-NodeMCU-v2
          path: esp8266-nodemcuv2-firmware.bin
          if-no-files-found: error
          retention-days: 30
